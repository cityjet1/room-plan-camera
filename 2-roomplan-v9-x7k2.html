<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Room plan camera</title>
<style>
html,body{margin:0;background:#f4f1ec;color:#1c2732;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
#root{max-width:760px;margin:0 auto;padding:16px 14px;}
h1{font-size:22px;margin:6px 0 2px;}
.sub{color:#4d5a68;font-size:13px;margin:0 0 14px;}
.rp-root { display:block; }
.rp-root .rp-card { background:rgba(20,30,40,0.05); border:1px solid rgba(20,30,40,0.12); border-radius:10px; padding:14px; margin-bottom:12px; }
.rp-root .rp-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.rp-root button { background:#3da9fc; color:#06121c; border:0; border-radius:8px; padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer; }
.rp-root button.rp-secondary { background:#26303b; color:#e8edf2; }
.rp-root button:disabled { opacity:.45; }
.rp-root .rp-muted { color:#4d5a68; font-size:13px; line-height:1.55; }
.rp-root .rp-warn { color:#8a5b00; font-size:13px; line-height:1.5; }
.rp-root .rp-hidden { display:none !important; }
.rp-root .rp-planwrap { background:#0d1116; border:1px solid rgba(20,30,40,0.12); border-radius:10px; padding:6px; margin-bottom:12px; }
.rp-root .rp-table { border-collapse:collapse; width:100%; font-size:13px; }
.rp-root .rp-table th, .rp-root .rp-table td { text-align:left; padding:5px 6px; border-bottom:1px solid rgba(20,30,40,0.12); }
.rp-root a { color:#1b7fc4; }

#rp-arui { position:fixed; inset:0; pointer-events:none; display:none; z-index:2147483000; }
#rp-arui.rp-on { display:block; }
#rp-reticle { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border:2px solid #3da9fc; border-radius:50%; opacity:.9; }
#rp-reticle.rp-hit { border-color:#35c48d; box-shadow:0 0 0 4px rgba(53,196,141,.25); }
#rp-reticle.rp-hit.rp-hold { border-color:#e8b23a; box-shadow:0 0 0 4px rgba(232,178,58,.25); }
#rp-ardiag { position:absolute; left:12px; right:12px; top:calc(56px + env(safe-area-inset-top)); padding:6px 8px; text-align:center; font-size:11px; color:#fff; background:rgba(10,14,18,.78); border-radius:6px; font-family:ui-monospace,monospace; pointer-events:none; }
#rp-arbottom { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:8px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(rgba(10,14,18,0), rgba(10,14,18,.7)); pointer-events:auto; }
#rp-arbar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
#rp-arbar button { background:#3da9fc; color:#06121c; border:0; border-radius:8px; padding:12px 14px; font-size:14px; font-weight:600; }
#rp-arbar button.rp-secondary { background:#26303b; color:#e8edf2; }
#rp-arbar button:disabled { opacity:.45; }
#rp-arstatus { position:absolute; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top)) 10px 10px; text-align:center; font-size:14px; color:#fff; background:rgba(10,14,18,.55); pointer-events:auto; font-family:system-ui,sans-serif; }
.rp-root textarea { background:#fff; color:#1c2732; border:1px solid rgba(20,30,40,0.25); border-radius:6px; padding:8px 10px; font-size:14px; font-family:ui-monospace,monospace; }
.rp-root input[type=number], .rp-root input[type=text] { background:#fff; color:#1c2732; border:1px solid rgba(20,30,40,0.25); border-radius:6px; padding:8px 10px; font-size:14px; }
.rp-root label { font-size:13px; color:#4d5a68; }
.rp-root a.rp-abtn { display:inline-block; background:#3da9fc; color:#06121c; border-radius:8px; padding:12px 16px; font-size:15px; font-weight:600; text-decoration:none; }
#rp-armodes { display:flex; gap:8px; justify-content:center; }
#rp-armodes .rp-mode { background:#26303b; color:#e8edf2; border:0; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; }
#rp-armodes .rp-mode.rp-on-mode { background:#3da9fc; color:#06121c; }

</style>
</head>
<body>
<div id="root"></div>
<script>
const inFrame = window.self !== window.top;
    let arui = null;

    document.getElementById('root').innerHTML = `<h1>Room plan camera</h1><p class="sub">Phone camera to floor plan. Plans stay on this device.</p>
      <div class="rp-card" id="rp-startCard">
        <p class="rp-muted" style="font-size:11px;margin:0 0 6px">Build v9 - 4 Nov</p>
        <div class="rp-row" style="margin-bottom:10px">
          <button id="rp-startAr">Start camera measuring</button>
        </div>
        <p class="rp-muted" id="rp-supportMsg">Checking whether this phone supports AR measuring...</p>
        <p class="rp-warn">Camera measuring estimates sizes from the phone's motion sensors and can drift from true dimensions. Check key walls with a tape - the app can calibrate the whole plan to one taped wall. Not suitable as the sole basis for an EPC or legal plan.</p>
      </div>
      <div class="rp-card">
        <b>How it works</b>
        <p class="rp-muted">1. Stand in the room and point the camera at the floor.<br>
        2. Move the phone slowly so it can map the room (good light and a floor with some pattern help).<br>
        3. In Corner mode, tap each corner on the screen where wall meets floor. You can also aim the circle and tap "Add point".<br>
        4. Switch to Window or Door mode to mark openings. Window: tap the two bottom corners of the glazing, then the top edge (the bottom corners set the sill height). Door: tap the two jambs at floor level, then the top edge. The app does not recognise them by itself - you mark them, it measures. Window facing comes from the phone compass (magnetic north) - approximate.<br>
        5. Work around the room, then tap "Close room". Repeat for each room on the floor.<br>
        6. Finish to see the 2D plan with wall lengths, window and door sizes, and areas. Calibrate one wall with a tape for best accuracy, then export.</p>
      </div>
      <div class="rp-card">
        <b>Tape-measure mode</b>
        <p class="rp-muted">No AR? Enter one wall per line as length in metres plus a turn: L (left 90), R (right 90) or S (straight on). After a wall, add a window as "W width height" or a door as "D width height" (metres) and it attaches to that wall. Works in any browser.</p>
        <textarea id="rp-manualInput" rows="6" style="width:100%">4 L
W 1.2 1.1
3 L
D 0.9 2.0
4 L
3 L</textarea>
        <div class="rp-row" style="margin-top:8px"><button class="rp-secondary" id="rp-drawManual">Draw plan from wall lengths</button></div>
      </div>
      <div class="rp-card">
        <b>Saved plans on this device</b>
        <div id="rp-savedList" class="rp-muted" style="margin-top:6px">None yet.</div>
      </div>

      <div id="rp-planView" class="rp-hidden">
        <div class="rp-card">
          <div class="rp-row">
            <button class="rp-secondary" id="rp-exportSvg">Export SVG</button>
            <button class="rp-secondary" id="rp-exportCsv">Export CSV</button>
            <button class="rp-secondary" id="rp-savePlan">Save</button>
            <button class="rp-secondary" id="rp-backHome">Back</button>
          </div>
          <p class="rp-muted" id="rp-planMeta" style="margin-top:8px"></p>
          <p class="rp-muted" id="rp-saveMsg" style="margin:4px 0 0 0"></p>
          <div class="rp-row" style="margin-top:8px">
            <label for="rp-north">Window facing: plan's right edge points</label>
            <input id="rp-north" type="number" step="1" min="0" max="359" style="width:80px" placeholder="90">
            <label>&deg; magnetic</label>
            <button class="rp-secondary" id="rp-northApply">Set north</button>
            <button class="rp-secondary" id="rp-northCompass">Use phone compass</button>
          </div>
          <p class="rp-muted" style="margin:4px 0 0 0">For "Use phone compass", hold the top edge of the phone pointing the way the plan's right edge faces, then tap. Magnetic north, phone compass - approximate; wave the phone in a figure-8 to calibrate.</p>
          <div class="rp-row" style="margin-top:8px">
            <label for="rp-calWall">Calibrate to tape: wall no.</label>
            <input id="rp-calWall" type="number" min="1" style="width:70px">
            <label for="rp-calLen">true length (m)</label>
            <input id="rp-calLen" type="number" step="0.01" min="0.1" style="width:90px" placeholder="3.42">
            <button class="rp-secondary" id="rp-calApply">Apply</button>
          </div>
        </div>
        <div class="rp-planwrap"><svg id="rp-plansvg" width="100%" height="420"></svg></div>
        <div class="rp-card"><b>Walls</b><div id="rp-wallTable"></div></div>
        <div class="rp-card"><b>Windows and doors</b><div id="rp-openTable"></div></div>
      </div>
    `;

    if (!inFrame) {
      arui = document.createElement('div');
      arui.id = 'rp-arui';
      arui.innerHTML = `
        <div id="rp-arstatus">Move the phone slowly to map the room, then tap each floor corner on the screen to place it...</div>
        <div id="rp-reticle"></div>
        <div id="rp-ardiag"></div>
        <div id="rp-arbottom">
          <div id="rp-armodes">
            <button id="rp-modeCorner" class="rp-mode rp-on-mode">Corner</button>
            <button id="rp-modeWindow" class="rp-mode rp-secondary">Window</button>
            <button id="rp-modeDoor" class="rp-mode rp-secondary">Door</button>
          </div>
          <div id="rp-arbar">
            <button id="rp-addCorner" disabled>Add point</button>
            <button id="rp-undoCorner" class="rp-secondary">Undo</button>
            <button id="rp-closeRoom" class="rp-secondary" disabled>Close room</button>
            <button id="rp-newRoom" class="rp-secondary" disabled>New room</button>
            <button id="rp-finishFloor" class="rp-secondary" disabled>Finish &amp; view plan</button>
          </div>
        </div>`;
      document.body.appendChild(arui);
    }

    const $ = (id) => document.getElementById(id);
    const store = {
      get() {
        try { return JSON.parse(localStorage.getItem('roomplans') || '[]'); }
        catch (e) { return (window).__rpSaved || []; }
      },
      set(v) {
        (window).__rpSaved = v;
        try { localStorage.setItem('roomplans', JSON.stringify(v)); } catch (e) { /* storage blocked: saves last for this visit only */ }
      },
    };
    const state = {
      session: null, refSpace: null, hitSrcPlane: null, hitSrcPoint: null, lockKind: '', viewerPose: null, lastDepth: -1, _depthSeen: false,
      rooms: [], cur: null, scale: 1.0, source: 'ar', floorY: null,
      mode: 'corner', pending: [],
    };

    const fmt = (m) => (m * state.scale).toFixed(2);
    const fmtArea = (m2) => (m2 * state.scale * state.scale).toFixed(1);

    const xr = (navigator).xr;
    if (inFrame) {
      $('rp-supportMsg').textContent = 'Camera measuring is blocked inside this Instinct frame and needs the app in its own browser tab. You can try "Start camera measuring" - if no new tab opens, current hosting does not allow camera mode; use tape-measure mode below.';
      const btn = $('rp-startAr');
      const a = document.createElement('a');
      a.id = 'rp-startAr';
      a.href = location.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Start camera measuring';
      a.className = 'rp-abtn';
      btn.replaceWith(a);
    } else if (xr && xr.isSessionSupported) {
      xr.isSessionSupported('immersive-ar').then((ok) => {
        if (ok) { $('rp-supportMsg').textContent = 'This device supports AR measuring. Tap "Start camera measuring" in good light.'; }
        else { $('rp-supportMsg').textContent = 'This device does not support AR measuring in the browser. Use tape-measure mode below instead.'; $('rp-startAr').disabled = true; }
      }).catch(() => { $('rp-supportMsg').textContent = 'Could not check AR support. Use tape-measure mode below.'; $('rp-startAr').disabled = true; });
    } else {
      $('rp-supportMsg').textContent = 'This browser does not support WebXR. On Android, open this page in Chrome. Otherwise use tape-measure mode below.';
      $('rp-startAr').disabled = true;
    }

    let latestHit = null;
    let latestViewer = null;
    // ARCore hits flicker frame to frame while tracking settles. We hold the last measured
    // surface point for a moment, but only while the phone has barely moved: the held point
    // is a fixed world position from a frame where tracking really measured it, so a short
    // hold never invents geometry - and moving the phone drops it at once.
    let lastGoodHit = null;
    const HOLD_MS = 400, HOLD_DIST = 0.04, HOLD_COS = Math.cos(8 * Math.PI / 180);
    // forward (-z) vector of a quaternion, for aim-change checks
    function fwdOf(q) { return [-2 * (q.w * q.y + q.x * q.z), 2 * (q.w * q.x - q.y * q.z), 2 * (q.x * q.x + q.y * q.y) - 1]; }
    // Depth sensing: ARCore's per-frame depth buffer measures real distance in metres without
    // waiting for plane or feature-point tracking - the stage that stalls on some phones.
    // state._depthSeen is set whenever a CPU depth buffer exists this frame (even if this
    // particular pixel has no valid depth), so the diag line can show availability.
    function depthHitNdc(ndcX, ndcY) {
      const pose = state.viewerPose;
      if (!pose || !pose.views) return null;
      for (let vi = 0; vi < pose.views.length; vi++) {
        const view = pose.views[vi];
        const di = view.getDepthInformation ? view.getDepthInformation() : null;
        if (!di || typeof di.getDepthInMeters !== 'function') continue;
        state._depthSeen = true;
        // normalised view coords, origin top-left, y down
        const nvx = (ndcX + 1) / 2, nvy = (1 - ndcY) / 2;
        const m = di.normDepthBufferFromNormView.matrix;
        const dbx = m[0] * nvx + m[4] * nvy + m[12];
        const dby = m[1] * nvx + m[5] * nvy + m[13];
        const d = di.getDepthInMeters(dbx, dby);
        if (!isFinite(d) || d <= 0.05 || d > 30) continue;
        // unproject through this view's (possibly asymmetric) projection matrix at measured depth
        const P = view.projectionMatrix;
        const vx = d * (ndcX + P[8]) / P[0];
        const vy = d * (ndcY + P[9]) / P[5];
        const M = view.transform.matrix;
        return { x: M[0] * vx + M[4] * vy - M[8] * d + M[12],
                 y: M[1] * vx + M[5] * vy - M[9] * d + M[13],
                 z: M[2] * vx + M[6] * vy - M[10] * d + M[14], d };
      }
      return null;
    }
    // a world-space ray direction -> NDC through the first view's projection, for tap rays
    function dirToNdc(f) {
      const pose = state.viewerPose;
      if (!pose || !pose.views || !pose.views.length) return null;
      const view = pose.views[0];
      const R = view.transform.inverse.matrix;
      const vx = R[0] * f[0] + R[4] * f[1] + R[8] * f[2];
      const vy = R[1] * f[0] + R[5] * f[1] + R[9] * f[2];
      const vz = R[2] * f[0] + R[6] * f[1] + R[10] * f[2];
      if (vz > -1e-4) return null;
      const P = view.projectionMatrix;
      return { x: P[0] * (vx / -vz) - P[8], y: P[5] * (vy / -vz) - P[9] };
    }
    // tap-to-place: a tap on empty overlay space becomes an XR select event whose ray starts at the
    // TAP position, not screen centre - a corner is captured by tapping it directly on the screen.
    let tapPlaneSrc = null, tapPointSrc = null, tapWait = null;
    function onXRSelect(ev) {
      const isrc = ev.inputSource;
      if (!isrc) return;
      tapWait = { t0: performance.now(), isrc };
      const profile = isrc.profiles && isrc.profiles[0];
      if (!tapPlaneSrc && !tapPointSrc && profile && state.session) {
        state.session.requestHitTestSourceForTransientInput({ profile: profile, entityTypes: ['plane'] })
          .then((s5) => { tapPlaneSrc = s5; }).catch(() => {});
        state.session.requestHitTestSourceForTransientInput({ profile: profile, entityTypes: ['point'] })
          .then((s6) => { tapPointSrc = s6; }).catch(() => {});
      }
    }

    function wrap360(d) { return ((d % 360) + 360) % 360; }
    // yaw of a plan-space vector around the vertical axis (right-handed, y up)
    function planYawDeg(v) { return Math.atan2(-v[1], v[0]) * 180 / Math.PI; }
    function degToCompass(d) {
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round(wrap360(d) / 22.5) % 16] + ' (' + Math.round(wrap360(d)) + '\u00B0 mag)';
    }
    function getHeading() {
      return new Promise((resolve) => {
        let done = false;
        const finish = (v) => { if (!done) { done = true; window.removeEventListener('deviceorientationabsolute', onAbs, true); window.removeEventListener('deviceorientation', onRel, true); resolve(v); } };
        const onAbs = (e) => { if (e.alpha != null) finish(wrap360(360 - e.alpha)); };
        const onRel = (e) => { if (e.webkitCompassHeading != null) finish(wrap360(e.webkitCompassHeading)); else if (e.absolute && e.alpha != null) finish(wrap360(360 - e.alpha)); };
        window.addEventListener('deviceorientationabsolute', onAbs, true);
        window.addEventListener('deviceorientation', onRel, true);
        setTimeout(() => finish(null), 1500);
      });
    }
    // outward-pointing unit normal of wall i of room r (plan coords [x, z])
    function outwardNormalOf(r, i) {
      const n = r.points.length;
      const a = r.points[i], b = r.points[(i + 1) % n];
      let dx = b[0] - a[0], dz = b[1] - a[1];
      const wl = Math.hypot(dx, dz);
      if (wl < 1e-6) return [1, 0];
      dx /= wl; dz /= wl;
      let cx = 0, cz = 0;
      r.points.forEach((p) => { cx += p[0]; cz += p[1]; });
      cx /= r.points.length; cz /= r.points.length;
      const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
      let nx = -dz, nz = dx;
      if (nx * (cx - mx) + nz * (cz - mz) > 0) { nx = -nx; nz = -nz; }
      return [nx, nz];
    }
    function viewerYawDeg(q) {
      const fx = -2 * (q.x * q.z + q.w * q.y);
      const fz = -1 + 2 * (q.x * q.x + q.y * q.y);
      return planYawDeg([fx, fz]);
    }
    function openingBearing(o, r) {
      if (o.bearing != null) return o.bearing;
      if (state.northOffset == null || o.wall === undefined) return null;
      return wrap360(state.northOffset - planYawDeg(outwardNormalOf(r, o.wall)));
    }

    function statusText() {
      const n = state.cur ? state.cur.points.length : 0;
      const base = 'Room ' + (state.rooms.length + (state.cur ? 0 : 1));
      if (state.mode === 'window') return base + ' - WINDOW: tap bottom-left corner, bottom-right corner, then top edge of the glazing (' + state.pending.length + '/3)';
      if (state.mode === 'door') return base + ' - DOOR: tap left jamb at floor, right jamb at floor, then top edge (' + state.pending.length + '/3)';
      return base + ' - ' + n + ' corner' + (n === 1 ? '' : 's') + (n >= 2 ? ' - last wall ' + lastWallLen() + ' m' : '');
    }

    let frameErrorShown = false;
    let statusHeld = false;
    function onFrame(_time, frame) {
      statusHeld = false;
      const session = frame.session;
      session.requestAnimationFrame(onFrame);
      latestHit = null;
      state.frames = (state.frames || 0) + 1;
      try {
      const layer = session.renderState && session.renderState.baseLayer;
      if (state.gl && layer) {
        state.gl.bindFramebuffer(state.gl.FRAMEBUFFER, layer.framebuffer);
        state.gl.clearColor(0, 0, 0, 0);
        state.gl.clear(state.gl.COLOR_BUFFER_BIT);
      }
      let viewerFresh = false;
      if (state.refSpace) {
        const vp = frame.getViewerPose(state.refSpace);
        if (vp) { state.viewerPose = vp; latestViewer = vp.transform; viewerFresh = true; }
      }
      state._depthSeen = false;
      const centerDepthHit = depthHitNdc(0, 0);
      state.lastDepth = centerDepthHit ? centerDepthHit.d : -1;
      // plane hits are the most stable; feature-point hits often appear sooner - prefer planes, fall back to points
      let freshHit = null, lockKind = '';
      if (state.hitSrcPlane && state.refSpace) {
        const results = frame.getHitTestResults(state.hitSrcPlane);
        if (results.length) {
          const pose = results[0].getPose(state.refSpace);
          if (pose) { freshHit = pose.transform.position; lockKind = 'plane'; }
        }
      }
      if (!freshHit && centerDepthHit) { freshHit = centerDepthHit; lockKind = 'depth'; }
      if (!freshHit && state.hitSrcPoint && state.refSpace) {
        const results2 = frame.getHitTestResults(state.hitSrcPoint);
        if (results2.length) {
          const pose2 = results2[0].getPose(state.refSpace);
          if (pose2) { freshHit = pose2.transform.position; lockKind = 'point'; }
        }
      }
      const now = performance.now();
      if (freshHit) {
        latestHit = freshHit;
        const f = latestViewer ? fwdOf(latestViewer.orientation) : [0, 0, -1];
        lastGoodHit = { x: freshHit.x, y: freshHit.y, z: freshHit.z,
          vx: latestViewer ? latestViewer.position.x : 0, vy: latestViewer ? latestViewer.position.y : 0, vz: latestViewer ? latestViewer.position.z : 0,
          fx: f[0], fy: f[1], fz: f[2], t: now, kind: lockKind };
        state.lockKind = lockKind;
      } else if (lastGoodHit && viewerFresh && (now - lastGoodHit.t) <= HOLD_MS) {
        const dx = latestViewer.position.x - lastGoodHit.vx, dy = latestViewer.position.y - lastGoodHit.vy, dz = latestViewer.position.z - lastGoodHit.vz;
        const f2 = fwdOf(latestViewer.orientation);
        const dot = f2[0] * lastGoodHit.fx + f2[1] * lastGoodHit.fy + f2[2] * lastGoodHit.fz;
        if (Math.hypot(dx, dy, dz) <= HOLD_DIST && dot >= HOLD_COS) {
          latestHit = { x: lastGoodHit.x, y: lastGoodHit.y, z: lastGoodHit.z };
          state.lockKind = 'hold';
        } else { state.lockKind = ''; }
      } else { state.lockKind = ''; }
      if (tapWait && state.refSpace) {
        let tapHit = null, tapKind = '';
        if (tapWait.isrc) {
          try {
            const tp = frame.getPose(tapWait.isrc.targetRaySpace, state.refSpace);
            if (tp) {
              const ndc = dirToNdc(fwdOf(tp.transform.orientation));
              if (ndc) { const dh = depthHitNdc(ndc.x, ndc.y); if (dh) { tapHit = dh; tapKind = 'depth'; state.lastDepth = dh.d; } }
            }
          } catch (e0) { /* depth route unavailable; fall through to hit-test */ }
        }
        if (!tapHit && tapPlaneSrc) {
          const tr = frame.getHitTestResultsForTransientInput(tapPlaneSrc);
          if (tr.length && tr[0].results.length) { const tp = tr[0].results[0].getPose(state.refSpace); if (tp) { tapHit = tp.transform.position; tapKind = 'plane'; } }
        }
        if (!tapHit && tapPointSrc) {
          const tr2 = frame.getHitTestResultsForTransientInput(tapPointSrc);
          if (tr2.length && tr2[0].results.length) { const tp2 = tr2[0].results[0].getPose(state.refSpace); if (tp2) { tapHit = tp2.transform.position; tapKind = 'point'; } }
        }
        if (tapHit) {
          state.tapKind = tapKind;
          capturePoint(tapHit);
          tapWait = null;

    function lastWallLen() {
      if (!state.cur || state.cur.points.length < 2) return '0.00';
      const p = state.cur.points;
      const a = p[p.length - 2], b = p[p.length - 1];
      return fmt(Math.hypot(b[0] - a[0], b[1] - a[1]));
    }

    function currentRoom() {
      if (!state.cur || state.cur.closed) {
        state.cur = { name: 'Room ' + (state.rooms.length + 1), points: [], openings: [], closed: false };
        state.rooms.push(state.cur);
      }
      return state.cur;
    }

    function onSessionEnd() {

      if (arui) arui.classList.remove('rp-on');
      if (state.diagWatchdog) { clearTimeout(state.diagWatchdog); state.diagWatchdog = null; }

      document.body.style.background = '';
      root.style.display = '';

    }

    function shoelace(pts) {
      let a = 0;
      for (let i = 0; i < pts.length; i++) { const j = (i + 1) % pts.length; a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1]; }
      return Math.abs(a / 2);
    }

    // attach each opening's midpoint to the nearest wall of its room
    function locateOpenings() {
      state.rooms.forEach((r) => {
        (r.openings || []).forEach((o) => {
          if (o.wall !== undefined || !o.mid) return;
          let best = { wall: 0, t: 0, d: 1e9 };
          const n = r.points.length, lim = r.closed ? n : n - 1;
          for (let i = 0; i < lim; i++) {
            const a = r.points[i], b = r.points[(i + 1) % n];
            const wx = b[0] - a[0], wy = b[1] - a[1];
            const wl2 = wx * wx + wy * wy;
            if (wl2 < 1e-6) continue;
            let u = ((o.mid[0] - a[0]) * wx + (o.mid[1] - a[1]) * wy) / wl2;
            u = Math.max(0, Math.min(1, u));
            const px = a[0] + u * wx, py = a[1] + u * wy;
            const d = Math.hypot(o.mid[0] - px, o.mid[1] - py);
            if (d < best.d) best = { wall: i, t: u * Math.sqrt(wl2), d };
          }
          o.wall = best.wall; o.t = best.t;
          delete o.mid;
        });
      });
    }

    function showPlan() {
      locateOpenings();
      $('rp-planView').classList.remove('rp-hidden');
      $('rp-startCard').classList.add('rp-hidden');

      const W = svg.clientWidth || 360, H = 420;
      let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
      state.rooms.forEach((r) => r.points.forEach((p) => {
        if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
        if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
      }));

      const s = Math.min((W - 2 * pad) / Math.max(0.001, maxx - minx), (H - 2 * pad) / Math.max(0.001, maxy - miny));
      const X = (x) => pad + (x - minx) * s;
      const Y = (y) => H - (pad + (y - miny) * s);
      let out = '', rows = '', orows = '', total = 0, winTotal = 0;
      state.rooms.forEach((r) => {
        let d = '';
        r.points.forEach((p, i) => { d += (i ? ' L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); });
        if (r.closed) d += ' Z';
        out += '<path d="' + d + '" fill="rgba(61,169,252,0.12)" stroke="#3da9fc" stroke-width="2"/>';
        const n = r.points.length, lim = r.closed ? n : n - 1;
        for (let i = 0; i < lim; i++) {

          const len = Math.hypot(c[0] - a2[0], c[1] - a2[1]);
          const wn = outwardNormalOf(r, i);
          const mx = (X(a2[0]) + X(c[0])) / 2 - wn[0] * 14, my = (Y(a2[1]) + Y(c[1])) / 2 + wn[1] * 14 + 4;
          out += '<text x="' + mx + '" y="' + my + '" fill="#e8edf2" font-size="11" text-anchor="middle" font-family="system-ui,sans-serif" stroke="#0d1116" stroke-width="3" paint-order="stroke">' + fmt(len) + '</text>';
          rows += '<tr><td>' + r.name + '</td><td>wall ' + (i + 1) + '</td><td>' + fmt(len) + ' m</td></tr>';
        }
        let roomWin = 0;
        (r.openings || []).forEach((o) => {
          if (o.wall === undefined) return;
          const a2 = r.points[o.wall], c = r.points[(o.wall + 1) % n];
          const wl = Math.hypot(c[0] - a2[0], c[1] - a2[1]);
          if (wl < 0.01) return;
          const dx = (c[0] - a2[0]) / wl, dy = (c[1] - a2[1]) / wl;
          const t = Math.max(o.width / 2, Math.min(wl - o.width / 2, o.t));
          const p1x = a2[0] + dx * (t - o.width / 2), p1y = a2[1] + dy * (t - o.width / 2);
          const p2x = a2[0] + dx * (t + o.width / 2), p2y = a2[1] + dy * (t + o.width / 2);
          const col = o.type === 'window' ? '#f2b134' : '#c98bfa';
          out += '<line x1="' + X(p1x) + '" y1="' + Y(p1y) + '" x2="' + X(p2x) + '" y2="' + Y(p2y) + '" stroke="' + col + '" stroke-width="5" stroke-linecap="round"/>';
          const nrm = outwardNormalOf(r, o.wall);
          const vert = Math.abs(nrm[0]) > 0.5;
          const off = vert ? 9 : 20;
          const anchor = vert ? (nrm[0] > 0 ? 'start' : 'end') : 'middle';
          const mx = (X(p1x) + X(p2x)) / 2 + nrm[0] * off, my = (Y(p1y) + Y(p2y)) / 2 - nrm[1] * off + (vert ? 4 : 0);
          out += '<text x="' + mx + '" y="' + my + '" fill="' + col + '" font-size="11" font-weight="600" text-anchor="' + anchor + '" font-family="system-ui,sans-serif" stroke="#0d1116" stroke-width="3" paint-order="stroke">' + (o.type === 'window' ? 'W' : 'D') + ' ' + fmt(o.width) + 'x' + fmt(o.height) + '</text>';
          const area = o.width * o.height;
          if (o.type === 'window') { roomWin += area; winTotal += area; }
          const brg = openingBearing(o, r);
          orows += '<tr><td>' + r.name + '</td><td>' + (o.type === 'window' ? 'Window' : 'Door') + '</td><td>wall ' + (o.wall + 1) + '</td><td>' + fmt(o.width) + ' m</td><td>' + fmt(o.height) + ' m</td><td>' + (o.type === 'window' && o.sill != null ? fmt(o.sill) + ' m' : '-') + '</td><td>' + fmtArea(area) + ' m\u00B2</td><td>' + (brg != null ? degToCompass(brg) : 'set north') + '</td></tr>';
        });
        r.points.forEach((p) => { out += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="3" fill="#35c48d"/>'; });
        if (r.closed) {
          const area = shoelace(r.points); total += area;
          let cx = 0, cy = 0;
          r.points.forEach((p) => { cx += X(p[0]); cy += Y(p[1]); });
          cx /= r.points.length; cy /= r.points.length;
          out += '<text x="' + cx + '" y="' + cy + '" fill="#9aa7b4" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">' + r.name + '<tspan x="' + cx + '" dy="14">' + fmtArea(area) + ' m\u00B2' + (roomWin ? ' - windows ' + fmtArea(roomWin) + ' m\u00B2' : '') + '</tspan></text>';
        }
      });
      svg.innerHTML = out;
      $('rp-wallTable').innerHTML = '<table class="rp-table"><tr><th>Room</th><th>Wall</th><th>Length</th></tr>' + rows + '</table>';
      $('rp-openTable').innerHTML = orows
        ? '<table class="rp-table"><tr><th>Room</th><th>Type</th><th>On</th><th>Width</th><th>Height</th><th>Sill</th><th>Area</th><th>Facing</th></tr>' + orows + '</table>'
        : '<p class="rp-muted">None marked. Mark windows and doors in Window/Door mode, or with W/D lines in tape-measure mode.</p>';
      $('rp-planMeta').textContent = state.rooms.length + ' room(s)' +
        (total ? ' - total ' + fmtArea(total) + ' m\u00B2' : '') +
        (winTotal ? ' - windows ' + fmtArea(winTotal) + ' m\u00B2' : '') +
        (state.scale !== 1 ? ' - calibrated x' + state.scale.toFixed(3) : (state.source === 'manual' ? ' - entered by tape' : ' - uncalibrated camera estimate'));
      $('rp-saveMsg').textContent = '';
    }

    function setMode(m) {

        state.diagWatchdog = setTimeout(() => {
          if (!state.frames) {
            const dg = $('rp-ardiag');
            if (dg) dg.textContent = 'diag: no frames 3s after start - the AR frame loop is not running | layer on | srcs p:' + (state.hitSrcPlane ? 'on' : 'OFF') + ' pt:' + (state.hitSrcPoint ? 'on' : 'OFF') + ' | feats ' + ((session.enabledFeatures || []).join(',') || '?') + ' | v9';

            .catch(() => { session.requestHitTestSource({ space: viewerSpace }).then((src2) => { state.hitSrcPlane = src2; }).catch(() => {}); });
          session.requestHitTestSource({ space: viewerSpace, entityTypes: ['point'] }).then((src3) => { state.hitSrcPoint = src3; }).catch(() => {});
        }).catch((e) => { $('rp-arstatus').textContent = 'AR error: ' + e.message; });
      }).catch((e) => {

    });

    if (!inFrame) {
      // UI taps must not also place points; empty overlay space stays tappable for placement
      $('rp-arbottom').addEventListener('beforexrselect', (e) => e.preventDefault());

      $('rp-modeWindow').addEventListener('click', () => setMode('window'));
      $('rp-modeDoor').addEventListener('click', () => setMode('door'));

      $('rp-addCorner').addEventListener('click', () => {
        capturePoint(latestHit);
      });

      function capturePoint(capHit) {
        if (!capHit) return;
        const room = currentRoom();
        if (state.mode === 'window' || state.mode === 'door') {
          state.pending.push({ x: capHit.x, y: capHit.y, z: capHit.z });
          if (state.pending.length >= 3) {
            const a = state.pending[0], b = state.pending[1], top = state.pending[2];
            const width = Math.hypot(b.x - a.x, b.z - a.z);
            const height = Math.abs(top.y - (a.y + b.y) / 2);
            if (width > 0.05 && height > 0.05) {
              const o = { type: state.mode, width, height, mid: [(a.x + b.x) / 2, (a.z + b.z) / 2] };
              // window: bottom taps are the sill corners, so height is glazing height and sill is its level above the floor
              if (state.mode === 'window' && state.floorY !== null) o.sill = (a.y + b.y) / 2 - state.floorY;
              if (state.mode === 'door') o.sill = 0;

                  if (wl2 < 1e-6) continue;

                  u = Math.max(0, Math.min(1, u));
                  const d = Math.hypot(mid[0] - (p1[0] + u * wx), mid[1] - (p1[1] + u * wz));

              }

            }

        }

      $('rp-undoCorner').addEventListener('click', () => {

    }

    $('rp-drawManual').addEventListener('click', () => {

        const t = line.trim();

        const tt = (m[2] || 'S').toUpperCase();

      });

    });

    $('rp-calApply').addEventListener('click', () => {

      });

      const trueLen = parseFloat($('rp-calLen').value);
      if (!(idx >= 1 && idx <= flat.length) || !(trueLen > 0)) { $('rp-saveMsg').textContent = 'Enter a wall number from the table below (1 to ' + flat.length + ') and its taped length in metres.'; return; }

    });

    });

    function download(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    $('rp-exportSvg').addEventListener('click', () => {
      const svg = $('rp-plansvg').cloneNode(true);
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svg.setAttribute('style', 'background:#0d1116');
      download(new Blob(['<?xml version="1.0"?>\n' + (svg).outerHTML], { type: 'image/svg+xml' }), 'room-plan.svg');
    });
    $('rp-exportCsv').addEventListener('click', () => {
      const rows = ['room,item,detail,width_m,height_m,area_m2,facing_deg_magnetic'];
      state.rooms.forEach((r) => {
        const n = r.points.length, lim = r.closed ? n : n - 1;
        for (let i = 0; i < lim; i++) { const a2 = r.points[i], c = r.points[(i + 1) % n]; rows.push('"' + r.name + '",wall,' + (i + 1) + ',' + fmt(Math.hypot(c[0] - a2[0], c[1] - a2[1])) + ',,'); }
        (r.openings || []).forEach((o) => { const b = openingBearing(o, r); rows.push('"' + r.name + '",' + o.type + ',wall ' + ((o.wall || 0) + 1) + ',' + fmt(o.width) + ',' + fmt(o.height) + ',' + fmtArea(o.width * o.height) + (b != null ? ',' + Math.round(wrap360(b)) : '')); });
        if (r.closed) rows.push('"' + r.name + '",floor_area,,,,' + fmtArea(shoelace(r.points)));
      });
      download(new Blob([rows.join('\n')], { type: 'text/csv' }), 'room-plan.csv');
    });
    $('rp-savePlan').addEventListener('click', () => {
      const saved = store.get();
      saved.push({ when: new Date().toISOString(), scale: state.scale, rooms: state.rooms, source: state.source });
      store.set(saved);
      renderSaved();
      $('rp-saveMsg').textContent = 'Saved on this device.';
    });
    $('rp-backHome').addEventListener('click', () => {
      $('rp-planView').classList.add('rp-hidden');
      $('rp-startCard').classList.remove('rp-hidden');
      window.scrollTo(0, 0);
    });

    function renderSaved() {
      const saved = store.get();
      const list = $('rp-savedList');
      list.innerHTML = saved.length
        ? saved.map((p, i) => '<div><a href="#" data-i="' + i + '">' + String(p.when).slice(0, 16).replace('T', ' ') + ' - ' + p.rooms.length + ' room(s)</a></div>').join('')
        : 'None yet.';
      Array.prototype.forEach.call(list.querySelectorAll('a'), (a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const p = saved[parseInt(a.getAttribute('data-i'), 10)];
          state.rooms = p.rooms; state.scale = p.scale || 1; state.cur = null; state.source = p.source || 'ar';
          showPlan();
          $('rp-planView').scrollIntoView();
        });
      });
    }
    renderSaved();

</script>
</body>
</html>
